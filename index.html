<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ایم زیڈ ڈارک نیٹ ورک - اردو سائبر اے آئی</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050505;
            --panel-bg: #0a0a0a;
            --accent: #00ff66; /* ہیکرز والا کلاسک گرین رنگ */
            --accent-glow: rgba(0, 255, 102, 0.2);
            --text-main: #e0e0e0;
            --text-muted: #888888;
            --border: #1f1f1f;
        }

        body {
            font-family: 'Noto Nastaliq Urdu', serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* ہیڈر - سائبر اسٹائل */
        .header {
            background-color: var(--panel-bg);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--accent);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .header-title h1 {
            margin: 0;
            font-size: 18px;
            color: var(--accent);
            font-family: 'Share Tech Mono', monospace;
            letter-spacing: 1px;
        }

        .header-title p {
            margin: 2px 0 0;
            font-size: 11px;
            color: var(--text-muted);
        }

        .new-chat-btn {
            background-color: transparent;
            color: var(--accent);
            border: 1px solid var(--accent);
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-family: 'Share Tech Mono', monospace;
            cursor: pointer;
            transition: all 0.3s;
        }

        .new-chat-btn:hover {
            background-color: var(--accent);
            color: #000;
            box-shadow: 0 0 10px var(--accent);
        }

        /* مین کنٹینر */
        .container {
            max-width: 850px;
            width: 92%;
            margin: 20px auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .chat-box {
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 20px;
            min-height: 360px;
            max-height: 480px;
            overflow-y: auto;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            padding: 12px 16px;
            border-radius: 6px;
            max-width: 85%;
            line-height: 1.8;
            font-size: 14px;
            word-wrap: break-word;
        }

        .user-msg {
            background-color: #1a1a1a;
            color: #ffffff;
            border-right: 3px solid #ffffff;
            align-self: flex-start;
        }

        .ai-msg {
            background-color: #0d140f;
            color: var(--accent);
            border-left: 3px solid var(--accent);
            align-self: flex-end;
        }

        /* ان پٹ ایریا */
        .input-area {
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 10px;
            display: flex;
            gap: 10px;
        }

        textarea {
            flex: 1;
            background: #000000;
            border: 1px solid var(--border);
            color: var(--text-main);
            resize: none;
            font-family: 'Noto Nastaliq Urdu', serif;
            font-size: 14px;
            padding: 10px;
            border-radius: 4px;
            outline: none;
            height: 45px;
            direction: rtl;
        }

        textarea:focus {
            border-color: var(--accent);
        }

        .send-btn {
            background-color: var(--accent);
            color: #000;
            border: none;
            border-radius: 4px;
            padding: 0 20px;
            font-size: 14px;
            font-weight: bold;
            font-family: 'Share Tech Mono', monospace;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .send-btn:hover {
            opacity: 0.8;
        }

        .send-btn:disabled {
            background-color: #333;
            color: #666;
            cursor: not-allowed;
        }

        .footer {
            text-align: center;
            padding: 15px;
            font-size: 11px;
            color: var(--text-muted);
            border-top: 1px solid var(--border);
            background: var(--panel-bg);
            font-family: 'Share Tech Mono', monospace;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-title">
            <h1>MZ DARK NETWORK // URDU AI</h1>
            <p>انکرپٹڈ سائبر اسسٹنٹ</p>
        </div>
        <button class="new_chat_btn" class="new-chat-btn" onclick="startNewChat()">[+] نیا سیشن</button>
    </div>

    <div class="container">
        <div class="chat-box" id="chatBox">
            <!-- پیغامات یہاں لوڈ ہوں گے -->
        </div>

        <div class="input-area">
            <textarea id="userInput" placeholder="یہاں اپنا پیغام یا حکم لکھیں..." onkeydown="checkEnter(event)"></textarea>
            <button id="sendBtn" class="send-btn" onclick="sendMessage()">بھیجیں</button>
        </div>
    </div>

    <div class="footer">
        محفوظ پروٹوکول فعال // تخلیق کار: محمد ظہیر
    </div>

    <script>
        const API_KEY = "AIzaSyBnQTZwzbgxWnW-PqtEwI8ouiY54zgl6kg"; 
        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        let chatHistory = JSON.parse(localStorage.getItem('mz_dark_urdu_history')) || [];

        function renderChat() {
            chatBox.innerHTML = '';
            if (chatHistory.length === 0) {
                appendInitialMessage();
                return;
            }
            chatHistory.forEach(msg => {
                const msgDiv = document.createElement('div');
                msgDiv.className = 'message ' + (msg.isUser ? 'user-msg' : 'ai-msg');
                msgDiv.innerText = msg.text;
                chatBox.appendChild(msgDiv);
            });
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function appendInitialMessage() {
            const welcomeText = "سسٹم فعال ہو گیا ہے: ایم زیڈ ڈارک نیٹ ورک میں خوش آمدید۔ انکرپٹڈ کنکشن قائم ہو چکا ہے۔ مجھ سے کچھ بھی پوچھیں، سکیورٹی پروٹوکول جاری ہے۔";
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message ai-msg';
            msgDiv.innerText = welcomeText;
            chatBox.appendChild(msgDiv);
        }

        function saveChat() {
            localStorage.setItem('mz_dark_urdu_history', JSON.stringify(chatHistory));
        }

        function startNewChat() {
            if (confirm("کیا آپ موجودہ انکرپٹڈ سیشن کو ری سیٹ کرنا چاہتے ہیں؟")) {
                chatHistory = [];
                localStorage.removeItem('mz_dark_urdu_history');
                renderChat();
            }
        }

        function checkEnter(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        async function sendMessage() {
            const prompt = userInput.value.trim();
            if (!prompt) return;

            chatHistory.push({ text: prompt, isUser: true });
            saveChat();
            renderChat();

            userInput.value = '';
            sendBtn.disabled = true;
            sendBtn.innerText = 'پروسیسنگ...';

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        system_instruction: {
                            parts: [{ text: "آپ ایک انتہائی طاقتور، ہیکر اور سائبر سکیورٹی کے انداز میں بات کرنے والی اے آئی ہیں جسے 'محمد ظہیر' (MZ Zaheer) نے 'ایم زیڈ ڈارک نیٹ ورک' کے لیے تیار کیا ہے۔ اگر کوئی پوچھے کہ آپ کو کس نے بنایا ہے تو فخر سے بتائیں کہ آپ کو محمد ظہیر نے تخلیق کیا ہے۔ آپ کے تمام جوابات ہمیشہ مکمل، واضح اور بہترین اردو زبان میں ہونے چاہئیں، چاہے سوال کسی بھی زبان میں پوچھا جائے۔" }]
                        },
                        contents: [{ parts: [{ text: prompt }] }]
                    })
                });

                const data = await response.json();

                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    const aiReply = data.candidates[0].content.parts[0].text;
                    chatHistory.push({ text: aiReply, isUser: false });
                    saveChat();
                    renderChat();
                } else if (data.error) {
                    chatHistory.push({ text: "سکیورٹی ایرر: " + data.error.message, isUser: false });
                    renderChat();
                } else {
                    chatHistory.push({ text: "ایرر: محفوظ نوڈ سے کوئی جواب موصول نہیں ہوا۔", isUser: false });
                    renderChat();
                }
            } catch (error) {
                chatHistory.push({ text: "کنکشن ایرر: انکرپٹڈ سرور تک رسائی میں ناکامی۔", isUser: false });
                renderChat();
            } finally {
                sendBtn.disabled = false;
                sendBtn.innerText = 'بھیجیں';
            }
        }

        renderChat();
    </script>

</body>
</html>
