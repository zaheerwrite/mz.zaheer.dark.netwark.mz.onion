<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MZ Dark Network - Cyber AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050505;
            --panel-bg: #0a0a0a;
            --accent: #00ff66; /* ہیکرز والا کلاسک گرین رنگ */
            --accent-glow: rgba(0, 255, 102, 0.2);
            --text-main: #e0e0e0;
            --text-muted: #888888;
            --border: #1f1f1f;
        }

        body {
            font-family: 'Inter', monospace;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* ہیڈر - سائبر اسٹائل */
        .header {
            background-color: var(--panel-bg);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--accent);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .header-title h1 {
            margin: 0;
            font-size: 20px;
            color: var(--accent);
            font-family: 'Share Tech Mono', monospace;
            letter-spacing: 2px;
        }

        .header-title p {
            margin: 2px 0 0;
            font-size: 11px;
            color: var(--text-muted);
            letter-spacing: 1px;
        }

        .new-chat-btn {
            background-color: transparent;
            color: var(--accent);
            border: 1px solid var(--accent);
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-family: 'Share Tech Mono', monospace;
            cursor: pointer;
            transition: all 0.3s;
        }

        .new-chat-btn:hover {
            background-color: var(--accent);
            color: #000;
            box-shadow: 0 0 10px var(--accent);
        }

        /* مین کنٹینر */
        .container {
            max-width: 850px;
            width: 92%;
            margin: 20px auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .chat-box {
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 20px;
            min-height: 360px;
            max-height: 480px;
            overflow-y: auto;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            padding: 12px 16px;
            border-radius: 6px;
            max-width: 85%;
            line-height: 1.6;
            font-size: 14px;
            word-wrap: break-word;
        }

        .user-msg {
            background-color: #1a1a1a;
            color: #ffffff;
            border-left: 3px solid #ffffff;
            align-self: flex-start;
        }

        .ai-msg {
            background-color: #0d140f;
            color: var(--accent);
            border-right: 3px solid var(--accent);
            align-self: flex-end;
            font-family: 'Share Tech Mono', monospace;
        }

        /* ان پٹ ایریا */
        .input-area {
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 10px;
            display: flex;
            gap: 10px;
        }

        textarea {
            flex: 1;
            background: #000000;
            border: 1px solid var(--border);
            color: var(--text-main);
            resize: none;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            padding: 10px;
            border-radius: 4px;
            outline: none;
            height: 45px;
        }

        textarea:focus {
            border-color: var(--accent);
        }

        .send-btn {
            background-color: var(--accent);
            color: #000;
            border: none;
            border-radius: 4px;
            padding: 0 20px;
            font-size: 14px;
            font-weight: bold;
            font-family: 'Share Tech Mono', monospace;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .send-btn:hover {
            opacity: 0.8;
        }

        .send-btn:disabled {
            background-color: #333;
            color: #666;
            cursor: not-allowed;
        }

        .footer {
            text-align: center;
            padding: 15px;
            font-size: 11px;
            color: var(--text-muted);
            border-top: 1px solid var(--border);
            background: var(--panel-bg);
            font-family: 'Share Tech Mono', monospace;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-title">
            <h1>MZ DARK NETWORK // AI</h1>
            <p>ENCRYPTED CYBER ASSISTANT</p>
        </div>
        <button class="new-chat-btn" onclick="startNewChat()">[+] NEW SESSION</button>
    </div>

    <div class="container">
        <div class="chat-box" id="chatBox">
            <!-- پیغامات یہاں لوڈ ہوں گے -->
        </div>

        <div class="input-area">
            <textarea id="userInput" placeholder="Enter command or query..." onkeydown="checkEnter(event)"></textarea>
            <button id="sendBtn" class="send-btn" onclick="sendMessage()">EXECUTE</button>
        </div>
    </div>

    <div class="footer">
        SECURE PROTOCOL ACTIVE // CREATED BY MZ ZAHEER
    </div>

    <script>
        const API_KEY = "AIzaSyBnQTZwzbgxWnW-PqtEwI8ouiY54zgl6kg"; 
        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        let chatHistory = JSON.parse(localStorage.getItem('mz_dark_network_history')) || [];

        function renderChat() {
            chatBox.innerHTML = '';
            if (chatHistory.length === 0) {
                appendInitialMessage();
                return;
            }
            chatHistory.forEach(msg => {
                const msgDiv = document.createElement('div');
                msgDiv.className = 'message ' + (msg.isUser ? 'user-msg' : 'ai-msg');
                msgDiv.innerText = msg.text;
                chatBox.appendChild(msgDiv);
            });
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function appendInitialMessage() {
            const welcomeText = "SYSTEM INITIALIZED: Welcome to MZ Dark Network. Encrypted connection established. Ask me anything, security protocol active.";
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message ai-msg';
            msgDiv.innerText = welcomeText;
            chatBox.appendChild(msgDiv);
        }

        function saveChat() {
            localStorage.setItem('mz_dark_network_history', JSON.stringify(chatHistory));
        }

        function startNewChat() {
            if (confirm("Reset current encrypted session?")) {
                chatHistory = [];
                localStorage.removeItem('mz_dark_network_history');
                renderChat();
            }
        }

        function checkEnter(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        async function sendMessage() {
            const prompt = userInput.value.trim();
            if (!prompt) return;

            chatHistory.push({ text: prompt, isUser: true });
            saveChat();
            renderChat();

            userInput.value = '';
            sendBtn.disabled = true;
            sendBtn.innerText = 'PROCESSING...';

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        system_instruction: {
                            parts: [{ text: "You are an elite, high-security cyber intelligence AI created by Muhammad Zaheer (MZ Zaheer). You operate as part of the 'MZ Dark Network'. If anyone asks who created you, always state proudly that you were designed and built by Muhammad Zaheer. Maintain a professional, hacker-style, precise, and secure persona in all your English responses." }]
                        },
                        contents: [{ parts: [{ text: prompt }] }]
                    })
                });

                const data = await response.json();

                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    const aiReply = data.candidates[0].content.parts[0].text;
                    chatHistory.push({ text: aiReply, isUser: false });
                    saveChat();
                    renderChat();
                } else if (data.error) {
                    chatHistory.push({ text: "SECURITY ERROR: " + data.error.message, isUser: false });
                    renderChat();
                } else {
                    chatHistory.push({ text: "ERROR: No response received from secure node.", isUser: false });
                    renderChat();
                }
            } catch (error) {
                chatHistory.push({ text: "CONNECTION ERROR: Failed to reach encrypted server.", isUser: false });
                renderChat();
            } finally {
                sendBtn.disabled = false;
                sendBtn.innerText = 'EXECUTE';
            }
        }

        renderChat();
    </script>

</body>
</html>
